name: Archive Telegram channel

on:
  push:
    branches: [claude/pensive-newton-1m0wgi]
    paths: [scripts/tg_scrape.py, .github/workflows/archive-telegram.yml, archive/channels.txt]
  workflow_dispatch:
    inputs:
      channel:
        description: Public channel username (empty = every channel in archive/channels.txt)
        default: ""

permissions:
  contents: write

concurrency:
  group: archive-telegram
  cancel-in-progress: true

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Scrape (commits progress every 50 files)
        env:
          CHECKPOINT_EVERY: "50"
          CHECKPOINT_CMD: git add archive && git commit -qm "Archive progress" && git pull -q --rebase && git push -q
        run: |
          channels="${{ inputs.channel }}"
          [ -n "$channels" ] || channels=$(grep -v '^#' archive/channels.txt)
          for ch in $channels; do
            echo "=== $ch ==="
            python scripts/tg_scrape.py "$ch"
          done
      - name: Commit archive
        if: always()
        run: |
          git add archive
          git diff --cached --quiet && exit 0
          git commit -m "Archive Telegram channels"
          git pull --rebase
          git push
